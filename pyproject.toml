[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gls1dr"
version = "1.0.0"
description = "Dose-response analysis of serum 1H-NMR signatures and a reduced GSH-ROS model after GLS1 therapy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "openpyxl>=3.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
gls1dr = "gls1dr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gls1dr = ["signatures_default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
